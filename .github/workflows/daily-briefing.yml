name: Daily Briefing

on:
  schedule:
    # 05:00 UTC ≈ 06:00/07:00 Berlin (je nach Sommer-/Winterzeit).
    # Cron in GitHub Actions ist nicht exakt - bei hoher Last kann der Lauf
    # um bis zu 10-15 Minuten verzoegert starten. Fuer ein Morning Briefing
    # meist unkritisch.
    - cron: '0 5 * * *'
  workflow_dispatch: {} # manueller Start ueber die Actions-UI zum Testen
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Laeuft nur beim Cron/manuellen Trigger - ein reiner Design-Push auf
  # main soll nicht erneut alle Feeds abfragen.
  ingest-and-curate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Feeds einsammeln
        run: python scripts/ingest.py

      - name: Kuratieren und ranken
        env:
          # Optional: als Repository Secret hinterlegen, um das
          # LLM-gestuetzte Ranking/Editorial-Summaries zu aktivieren.
          # Ohne gesetzten Key laeuft automatisch das regelbasierte Ranking.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/curate.py

      - name: Neues Briefing committen
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/briefings/
          git diff --quiet --cached || git commit -m "Briefing $(date -u +%F)"
          git push

  build-and-deploy:
    needs: [ingest-and-curate]
    if: always() && (needs.ingest-and-curate.result == 'success' || needs.ingest-and-curate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # holt den Stand inkl. des Commits aus dem Job oben

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Astro-Abhaengigkeiten installieren
        working-directory: site
        run: npm ci

      - name: Seite bauen
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
